[package]
name = "rare-pit-wall"
version = "0.33.0"
description = "Rare Pit Wall · programma per Windows del team Rare Project Motorsport"
authors = ["Rare Project Motorsport"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rare_pit_wall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "multipart"] }
tts = "0.26"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
cpal = "0.15"
libloading = "0.8"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Media_Multimedia"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
